<!doctype html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>6A 錯題書架</title>
  <meta name="description" content="中六 6A 個人錯題簿三維書架——按年份翻閱學生 PDF。">
  <meta name="theme-color" content="#ffe9c8">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+TC:wght@500;700;800&display=swap" rel="stylesheet">
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
    } }
  </script>
  <style>
    :root {
      --cream: #fff8ee; --ink: #3a2a20; --soft: #8a705c; --line: #ecdcc6;
      --coral: #e0745a; --green: #3f7a5a;
      --shadow: 0 12px 32px rgba(90, 50, 20, .2), 0 2px 6px rgba(90, 50, 20, .08);
      --sans: 'Pretendard Variable', Pretendard, 'Noto Sans TC', system-ui, sans-serif;
      --cute: 'Gaegu', 'Noto Sans TC', cursive;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #f2d8b0; color: var(--ink); font: 15px/1.6 var(--sans); letter-spacing: -0.02em; }
    body { position: fixed; inset: 0; }
    button, a, label, input { touch-action: manipulation; font: inherit; color: inherit; }
    button { cursor: pointer; border: 0; }
    #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    .ui { position: fixed; inset: 0; pointer-events: none; }
    .ui button, .ui a, .sheet, .desk, .gate, .ui input, .reader,
    .shelfbar, .tools, .hint, .move-hint, .year-table, .book-rail { pointer-events: auto; }
    .pill { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; background: var(--cream); box-shadow: var(--shadow); font-weight: 700; }
    [hidden] { display: none !important; }

    .brand {
      position: absolute; left: 14px; top: calc(14px + env(safe-area-inset-top));
      display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px 6px 9px; border-radius: 5px;
      font: 700 20px/1 var(--cute), cursive; background: #fbf1df;
      box-shadow: 0 2px 0 rgba(120, 80, 45, .22), 0 6px 14px rgba(90, 50, 20, .12);
      outline: 1.5px dashed rgba(138, 100, 70, .45); outline-offset: -4px;
    }
    .brand svg { width: 20px; height: 20px; fill: #2a2623; }

    .tools { position: absolute; right: 14px; top: 0; display: flex; align-items: flex-start; gap: 10px; }
    #floorBtn {
      order: 2; flex-direction: column; gap: 3px; width: 64px; padding: calc(10px + env(safe-area-inset-top)) 0 22px;
      border-radius: 0; box-shadow: none; color: #fff; background: var(--fcd, #86afd8);
      clip-path: polygon(0 0, 100% 0, 100% 100%, 50% calc(100% - 11px), 0 100%);
      font: 700 18px/1 var(--cute), cursive; animation: ribbon .55s cubic-bezier(.2, .9, .3, 1.15);
    }
    #floorBtn small { font: 700 10px/1 var(--sans); opacity: .8; }
    @keyframes ribbon { from { transform: translateY(-100%); } }
    #lobbyBtn, #whoBtn, #exploreBtn {
      order: 0; height: 38px; margin-top: calc(14px + env(safe-area-inset-top));
      padding: 0 13px; gap: 5px; font-size: 13px;
    }
    body[data-state="gate"] #floorBtn,
    body[data-state="gate"] #lobbyBtn,
    body[data-state="gate"] #whoBtn { display: none; }
    body[data-state="intro"] #lobbyBtn,
    body[data-state="walk"] #lobbyBtn,
    body[data-state="gate"] #lobbyBtn,
    body[data-state="travel"] #lobbyBtn { display: none; }
    body[data-state="intro"] #floorBtn,
    body[data-state="walk"] #floorBtn,
    body[data-state="travel"] #floorBtn,
    body[data-state="arrive"] #floorBtn,
    body[data-state="gate"] #floorBtn { display: none; }
    body[data-state="sign"] #lobbyBtn,
    body[data-state="shelf"] #lobbyBtn,
    body[data-state="book"] #lobbyBtn,
    body[data-state="roam"] #lobbyBtn { display: inline-flex; }

    .hint {
      position: absolute; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom));
      transform: translateX(-50%); padding: 12px 18px 12px 12px; font-size: 15px; white-space: nowrap;
      transition: opacity .4s, transform .4s; gap: 10px;
    }
    .hint .paw { width: 28px; height: 28px; border-radius: 50%; background: #2a2623; display: grid; place-items: center; flex: none; }
    .hint .paw svg { width: 19px; height: 19px; fill: #f4a9b6; }
    .hint em { font-style: normal; color: #a8784f; font-weight: 600; font-size: 13px; }
    body:not([data-state="intro"]) .hint { opacity: 0; pointer-events: none; transform: translate(-50%, 12px); }

    .move-hint {
      position: absolute; left: 14px; bottom: calc(24px + env(safe-area-inset-bottom));
      padding: 8px 12px; font-size: 12px; font-weight: 700; color: var(--soft);
    }
    .move-hint kbd {
      display: inline-block; min-width: 1.4em; padding: 1px 5px; margin: 0 1px;
      border-radius: 6px; background: #f3e6d3; color: var(--ink); font: 700 11px var(--sans);
      box-shadow: inset 0 -1px 0 rgba(90,50,20,.15);
    }


    #exploreBtn { display: none; }
    body[data-state="shelf"] #exploreBtn,
    body[data-state="book"] #exploreBtn { display: inline-flex; }

    .shelfbar {
      position: absolute; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom));
      transform: translateX(-50%); display: flex; align-items: center; gap: 10px;
      padding: 8px 8px 8px 16px; white-space: nowrap; font-size: 14px;
      transition: opacity .4s, transform .4s;
    }
    .shelfbar span { color: var(--soft); font-weight: 600; }
    .shelfbar button { border-radius: 999px; padding: 9px 14px; background: #2a2623; color: #fff8ee; font-weight: 700; font-size: 13px; }
    body:not([data-state="shelf"]):not([data-state="roam"]) .shelfbar { opacity: 0; pointer-events: none; transform: translate(-50%, 12px); }

    .toast {
      position: absolute; left: 50%; top: calc(64px + env(safe-area-inset-top));
      transform: translate(-50%, -8px); display: flex; align-items: center; gap: 10px;
      padding: 10px 16px; border-radius: 16px; background: var(--cream); box-shadow: var(--shadow);
      opacity: 0; transition: opacity .35s, transform .35s; white-space: nowrap; max-width: calc(100vw - 28px);
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .toast i { width: 12px; height: 12px; border-radius: 50%; flex: none; }
    .toast b { font: 700 20px/1 var(--cute), var(--sans); }
    .toast span { font-size: 13px; color: var(--soft); font-weight: 600; }

    .sheet, .desk { overscroll-behavior: contain; touch-action: pan-y; -webkit-overflow-scrolling: touch; }
    .sheet {
      position: absolute; left: 0; right: 0; bottom: 0; max-height: 72vh; overflow: auto;
      padding: 10px 16px calc(18px + env(safe-area-inset-bottom));
      border-radius: 26px 26px 0 0; background: var(--cream);
      box-shadow: 0 -12px 40px rgba(90, 50, 20, .25);
      transform: translateY(105%); transition: transform .45s cubic-bezier(.2, .8, .2, 1);
    }
    .sheet.show { transform: none; }
    .sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: #e2cdb2; margin: 2px auto 12px; }
    .sheet header { display: flex; justify-content: space-between; gap: 12px; }
    .sheet h2 { margin: 0; font: 700 25px/1.1 var(--cute), var(--sans); }
    .sheet header p { margin: 4px 0 0; font-size: 13px; color: var(--soft); }
    .sheet .x, .desk .x, .gate .x {
      width: 34px; height: 34px; flex: none; border-radius: 50%; background: #f3e6d3; font-size: 14px;
    }
    .sheet .tower { display: flex; flex-direction: column; align-items: center; margin-top: 12px; }
    .sheet .book {
      position: relative; display: flex; align-items: center; gap: 8px; height: 46px; margin-top: -2px;
      padding: 0 12px 0 0; border-radius: 8px 12px 12px 8px; background: var(--fc); color: #fff; text-align: left;
      box-shadow: inset 0 -5px 0 rgba(0,0,0,.1), 0 2px 0 rgba(90,50,20,.15); width: 92%;
    }
    .sheet .book::before { content: ''; align-self: stretch; flex: none; width: 14px; border-radius: 8px 0 0 8px; background: rgba(255,255,255,.35); }
    .sheet .book b { flex: none; font: 700 22px/1 var(--cute), cursive; text-shadow: 0 1px 0 rgba(0,0,0,.15); min-width: 3.2em; }
    .sheet .book span { flex: 1; min-width: 0; font-size: 12px; font-weight: 600; line-height: 1.25; }
    .sheet .book em { flex: none; padding: 2px 7px; border-radius: 99px; background: rgba(255,255,255,.3); font-style: normal; font-size: 11.5px; font-weight: 800; }
    .sheet .book.empty { color: #6b5646; background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--fc) 55%, #fff) 0 8px, color-mix(in srgb, var(--fc) 40%, #fff) 8px 16px); }
    .sheet .book.here { z-index: 1; margin-top: 8px; box-shadow: 0 0 0 3px #fff, 0 0 0 6px var(--coral), inset 0 -5px 0 rgba(0,0,0,.1); }
    .sheet .plate { width: 92%; height: 14px; margin-top: -2px; border-radius: 0 0 14px 14px; background: #d9b48a; }
    .sheet .modechip {
      display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap;
    }
    .sheet .modechip button {
      padding: 8px 12px; border-radius: 999px; background: #f3e6d3; font-weight: 700; font-size: 13px;
    }
    .sheet .modechip button.on { background: #2a2623; color: var(--cream); }

    .desk {
      position: absolute; right: 22px; top: 88px; bottom: 22px; width: 384px; overflow: auto;
      padding: 24px 24px 28px; border-radius: 26px; background: var(--cream); box-shadow: var(--shadow);
      opacity: 0; transform: translateX(24px); transition: opacity .4s, transform .4s; pointer-events: none;
    }
    .desk.show { opacity: 1; transform: none; pointer-events: auto; }
    .d-eyebrow { margin: 0; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--soft); }
    .chip { display: inline-grid; place-items: center; min-width: 28px; height: 24px; padding: 0 8px; border-radius: 999px; background: var(--fc); color: #fff; font-weight: 800; }
    .desk h2 { margin: 10px 0 4px; font-weight: 800; font-size: 24px; line-height: 1.3; letter-spacing: -0.04em; }
    .d-meta { margin: 0; font-size: 14px; color: var(--soft); }
    .d-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 4px; }
    .d-actions button, .d-actions a {
      font-weight: 700; font-size: 14px; padding: 11px 18px; border-radius: 999px;
      background: #2a2623; color: var(--cream); text-decoration: none;
    }
    .d-actions .ghost { background: #f3e6d3; color: var(--ink); }
    .d-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }

    .d-median-big {
      display: flex; align-items: baseline; gap: 12px; margin: 14px 0 10px;
      padding: 14px 16px; border-radius: 18px;
      background: color-mix(in srgb, var(--fc) 22%, #fffaf0);
      box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--fc) 45%, #fff);
    }
    .d-median-big span { font-size: 13px; font-weight: 700; color: var(--soft); }
    .d-median-big b { font-size: 40px; font-weight: 900; letter-spacing: -0.04em; color: var(--fc); }
    .d-you {
      margin: 12px 0; padding: 12px 14px; border-radius: 16px; background: #fff6e8;
      box-shadow: inset 0 0 0 1.5px var(--line);
    }
    .d-you-lab { font-size: 12px; font-weight: 800; color: #a8784f; margin-bottom: 8px; }
    .d-you-row { display: flex; flex-wrap: wrap; gap: 14px 18px; }
    .d-you-row .d-k { display: block; font-size: 11px; font-weight: 700; color: var(--soft); margin-bottom: 4px; }
    .d-you-row em.d-score { display: block; margin-top: 4px; font-style: normal; font-size: 12px; color: var(--soft); }
    .d-dist { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
    .d-dist-i {
      font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 999px;
      background: color-mix(in srgb, var(--fc) 28%, #fff); color: #3a2e28;
    }
    .d-sub { margin: 8px 0 6px; font-size: 13px; font-weight: 800; color: var(--soft); letter-spacing: 0.02em; }
    .d-roster {
      list-style: none; margin: 0 0 12px; padding: 0; max-height: 38vh; overflow: auto;
      border-radius: 14px; background: #fffaf3; box-shadow: inset 0 0 0 1px var(--line);
    }
    .d-roster li {
      display: grid; grid-template-columns: 36px 1fr auto; gap: 4px 8px; align-items: center;
      padding: 8px 12px; border-bottom: 1px solid color-mix(in srgb, var(--line) 70%, transparent);
      font-size: 13px;
    }
    .d-roster li:last-child { border-bottom: 0; }
    .d-roster li.me { background: color-mix(in srgb, var(--coral) 14%, #fffaf3); }
    .d-roster .d-sid { font-weight: 900; font-variant-numeric: tabular-nums; color: #6b5646; }
    .d-roster .d-name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .d-roster .d-score {
      grid-column: 2 / -1; font-size: 11px; color: var(--soft); margin-top: -2px;
    }
    .d-roster .chip { justify-self: end; }

    .gate {
      position: absolute; inset: 0; display: grid; place-items: center; padding: 24px;
      background: radial-gradient(circle at 50% 40%, #fff9ee, #f2d8b0 70%);
    }
    .gate[hidden] { display: none; }
    .gate-card {
      width: min(420px, 100%); padding: 28px 24px 24px; border-radius: 26px; background: var(--cream);
      box-shadow: var(--shadow); outline: 1.5px dashed rgba(138, 100, 70, .35); outline-offset: -8px;
    }
    .gate-card h1 { margin: 0; font: 700 32px/1.15 var(--cute), cursive; }
    .gate-card p { margin: 8px 0 0; color: var(--soft); font-size: 14px; }
    .gate-card label { display: block; margin-top: 20px; font-size: 12px; font-weight: 700; color: var(--soft); }
    .gate-card input {
      width: 100%; margin-top: 6px; padding: 12px 14px; border: 0; border-radius: 14px;
      background: #fff; box-shadow: inset 0 0 0 1.5px var(--line); font: 700 22px/1 var(--cute), cursive;
      letter-spacing: .08em; outline: none;
    }
    .gate-card input:focus { box-shadow: inset 0 0 0 2px var(--coral); }
    .gate-actions { display: grid; gap: 8px; margin-top: 18px; }
    .gate-actions button {
      padding: 13px 16px; border-radius: 999px; background: #2a2623; color: var(--cream); font-weight: 800;
    }
    .gate-actions .ghost { background: #f3e6d3; color: var(--ink); }
    .gate-err { margin: 10px 0 0; color: var(--coral); font-size: 13px; font-weight: 700; min-height: 1.2em; }

    .reader {
      position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center;
      background: rgba(42, 38, 35, .55);
    }
    .reader[hidden] { display: none; }
    .r-box {
      display: flex; flex-direction: column; width: min(1000px, 94vw); height: 90vh;
      border-radius: 22px; overflow: hidden; background: var(--cream); box-shadow: 0 20px 60px rgba(20,10,0,.4);
    }
    .r-box header {
      display: flex; align-items: center; gap: 10px; padding: 10px 10px 10px 18px; border-bottom: 1px solid var(--line);
    }
    .r-src { flex: 1; min-width: 0; }
    .r-src b { display: block; font-size: 12px; color: #a8784f; }
    .r-src span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 800; }
    #rClose { width: 36px; height: 36px; border-radius: 50%; background: #f3e6d3; }
    .r-body { position: relative; flex: 1; background: #fff; }
    .r-wait { position: absolute; inset: 0; display: grid; place-items: center; margin: 0; color: var(--soft); font-weight: 700; }
    #rFrame { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    #rOut { font-size: 12px; font-weight: 700; color: #24456a; text-decoration: none; margin-right: 6px; }

    #fade { position: fixed; inset: 0; background: radial-gradient(circle at 50% 45%, #fff9ee, #ffe6bf); opacity: 0; pointer-events: none; transition: opacity .5s; }
    #fade.on { opacity: 1; }
    .loading {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; gap: 8px;
      background: #f6e2c2; color: var(--soft); font-weight: 700; transition: opacity .7s; z-index: 50;
    }
    .loading i { width: 8px; height: 8px; border-radius: 50%; background: #2a2623; animation: bob 1s ease-in-out infinite; }
    .loading i:nth-of-type(2) { animation-delay: .15s; }
    .loading i:nth-of-type(3) { animation-delay: .3s; }
    @keyframes bob { 50% { transform: translateY(-6px); } }
    .loading.hide { opacity: 0; pointer-events: none; }

    .tip {
      position: absolute; left: 0; top: 0; padding: 9px 13px; border-radius: 14px;
      background: var(--cream); box-shadow: var(--shadow); opacity: 0; transition: opacity .15s; max-width: 240px; pointer-events: none;
    }
    .tip.show { opacity: 1; }
    .tip b { display: block; font-weight: 800; font-size: 14px; }
    .tip span { font-size: 12px; color: var(--soft); }

    @media (max-width: 760px) {
      .desk {
        left: 0; right: 0; bottom: 0; top: auto; width: auto; max-height: 52vh;
        border-radius: 26px 26px 0 0; padding: 20px 18px calc(24px + env(safe-area-inset-bottom));
        transform: translateY(24px);
      }
      .desk.show { transform: none; }
      .r-box { width: 100vw; height: 100%; border-radius: 0; }
    }

    .fur-pick { margin-top: 18px; }
    .fur-pick > span {
      display: block; font-size: 12px; font-weight: 700; color: var(--soft); margin-bottom: 8px;
    }
    .fur-swatches { display: flex; flex-wrap: wrap; gap: 8px; }
    .fur-swatches button {
      width: 34px; height: 34px; border-radius: 50%; padding: 0;
      box-shadow: inset 0 0 0 1.5px rgba(90,50,20,.18), 0 2px 4px rgba(90,50,20,.12);
      background: var(--fur); position: relative;
    }
    .fur-swatches button[aria-checked="true"] {
      box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--coral), inset 0 0 0 1px rgba(90,50,20,.2);
    }
    .fur-swatches button:focus-visible { outline: 2px solid var(--coral); outline-offset: 2px; }
    @media (min-width: 761px) {
      .sheet { left: auto; right: 28px; width: 420px; bottom: 22px; border-radius: 26px; transform: translateY(calc(100% + 48px)); }
      .sheet.show { transform: none; }
    }

    /* ===== Library split layout (primary UI after gate) ===== */
    body.library #c {
      filter: brightness(0.42) saturate(0.55) contrast(0.95);
      pointer-events: none; /* UI panels own all clicks in library mode */
    }
    body.library .lib-veil {
      display: block;
    }
    .lib-veil {
      display: none; position: fixed; inset: 0; z-index: 3;
      background: radial-gradient(ellipse at 50% 40%, rgba(255,248,238,.55), rgba(242,216,176,.82) 70%);
      pointer-events: none;
    }
    .year-table, .book-rail {
      position: fixed; z-index: 6;
      top: calc(58px + env(safe-area-inset-top));
      bottom: calc(72px + env(safe-area-inset-bottom));
      display: flex; flex-direction: column;
      padding: 16px 14px 14px;
      border-radius: 22px;
      background: var(--cream);
      box-shadow: var(--shadow);
      outline: 1.5px dashed rgba(138, 100, 70, .28);
      outline-offset: -7px;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s, transform .25s;
    }
    body.library .year-table,
    body.library .book-rail {
      opacity: 1;
      pointer-events: auto;
    }
    .year-table {
      left: 14px;
      width: min(360px, calc(50vw - 22px));
      transform: translateX(-12px);
    }
    .book-rail {
      right: 14px;
      width: min(360px, calc(50vw - 22px));
      transform: translateX(12px);
      background: #fff6e6;
    }
    body.library .year-table,
    body.library .book-rail { transform: none; }

    .year-table[hidden], .book-rail[hidden] { display: none !important; }

    .year-table header, .book-rail header {
      display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
      flex: none; padding: 0 4px 12px; border-bottom: 1px solid var(--line);
    }
    .year-table header h2, .book-rail header h2 {
      margin: 0; font: 700 24px/1.1 var(--cute), cursive; letter-spacing: -0.02em;
    }
    .year-table header span, .book-rail header span {
      font-size: 12px; font-weight: 700; color: var(--soft);
    }

    .year-table .yt-list {
      list-style: none; margin: 10px 0 0; padding: 0;
      flex: 1; overflow: auto; -webkit-overflow-scrolling: touch;
    }
    .year-table .yt-row {
      display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center;
      margin: 0 0 8px; padding: 8px; border-radius: 16px;
      background: #fffaf3; box-shadow: inset 0 0 0 1.5px var(--line);
    }
    .year-table .yt-row.on {
      background: color-mix(in srgb, var(--fc, #86afd8) 22%, #fffaf3);
      box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--coral);
    }
    .year-table .yt-main {
      display: grid; grid-template-columns: 58px 1fr; gap: 4px 10px; align-items: center;
      width: 100%; margin: 0; padding: 6px 8px; border-radius: 12px;
      background: transparent; text-align: left; font-weight: 700;
    }
    .year-table .yt-main:hover { background: rgba(255, 243, 224, .9); }
    .year-table .yt-year { font: 800 22px/1 var(--cute), cursive; color: var(--ink); }
    .year-table .yt-meta { font-size: 12px; line-height: 1.35; color: var(--soft); font-weight: 600; }
    .year-table .yt-meta b { color: var(--ink); font-weight: 800; }
    .year-table .yt-acts { display: flex; flex-direction: column; gap: 5px; }
    .year-table .yt-acts button {
      padding: 7px 12px; border-radius: 999px; font-size: 12px; font-weight: 800;
      background: #2a2623; color: var(--cream); white-space: nowrap;
    }
    .year-table .yt-acts button.ghost { background: #f3e6d3; color: var(--ink); }
    .year-table .yt-acts button:disabled { opacity: .38; cursor: not-allowed; }

    .book-rail .br-list {
      flex: 1; overflow: auto; -webkit-overflow-scrolling: touch;
      display: grid; grid-template-columns: 1fr; gap: 10px;
      margin-top: 12px; padding: 2px 2px 8px;
    }
    .book-rail .br-card {
      display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: center;
      width: 100%; padding: 12px; border-radius: 18px;
      background: #fffaf3; text-align: left;
      box-shadow: inset 0 0 0 1.5px var(--line), 0 4px 12px rgba(90,50,20,.08);
      transition: transform .12s, box-shadow .12s;
      cursor: pointer;
    }
    .book-rail .br-card:hover {
      transform: translateY(-2px);
      box-shadow: inset 0 0 0 1.5px var(--line), 0 8px 18px rgba(90,50,20,.14);
    }
    .book-rail .br-card:active { transform: translateY(0); }
    .book-rail .br-card.on {
      box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--coral), 0 6px 14px rgba(90,50,20,.12);
    }
    .book-rail .br-spine {
      width: 64px; height: 88px; border-radius: 8px 12px 12px 8px;
      background: linear-gradient(90deg, rgba(0,0,0,.14), transparent 18%), var(--fc, #86afd8);
      color: #fffaf0; display: grid; place-items: center; text-align: center;
      font: 800 14px/1.2 var(--sans); padding: 6px;
      box-shadow: inset -4px 0 0 rgba(0,0,0,.1), 3px 4px 10px rgba(90,50,20,.2);
    }
    .book-rail .br-body b { display: block; font-size: 16px; font-weight: 800; letter-spacing: -0.02em; }
    .book-rail .br-body span { display: block; margin-top: 4px; font-size: 12px; line-height: 1.35; color: var(--soft); font-weight: 600; }
    .book-rail .br-empty {
      margin: 28px 10px; text-align: center; color: var(--soft); font-weight: 700; font-size: 13px; line-height: 1.5;
    }

    body.library .shelfbar {
      z-index: 7; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom));
      max-width: min(520px, calc(100vw - 28px));
    }
    body.library #floorBtn,
    body.library #exploreBtn,
    body.library #lobbyBtn,
    body.library .hint,
    body.library .move-hint { display: none !important; }

    .desk { z-index: 8; }
    .toast { z-index: 9; }
    .reader { z-index: 40; }

    @media (max-width: 900px) {
      .year-table, .book-rail {
        top: calc(54px + env(safe-area-inset-top));
        bottom: calc(64px + env(safe-area-inset-bottom));
        width: calc(50vw - 16px);
        padding: 12px 10px 10px;
      }
      .year-table { left: 8px; }
      .book-rail { right: 8px; }
      .year-table header h2, .book-rail header h2 { font-size: 20px; }
      .book-rail .br-spine { width: 52px; height: 72px; font-size: 12px; }
      .year-table .yt-acts button { padding: 6px 9px; font-size: 11px; }
    }
    @media (max-width: 560px) {
      /* Stack: table top, books bottom */
      .year-table {
        left: 8px; right: 8px; width: auto;
        top: calc(52px + env(safe-area-inset-top));
        bottom: calc(50% + 4px);
      }
      .book-rail {
        left: 8px; right: 8px; width: auto;
        top: calc(50% + 4px);
        bottom: calc(60px + env(safe-area-inset-bottom));
      }
      .book-rail .br-list { grid-template-columns: 1fr 1fr; }
    }

  </style>
</head>
